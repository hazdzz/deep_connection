# Override of the built-in social_iqa task.
# The upstream repo allenai/social_i_qa is script-based, which datasets>=4.0
# refuses to load ("Dataset scripts are no longer supported").
# The Hub keeps an auto-converted parquet branch, so we point at that instead.
# Everything else is copied verbatim from the built-in task so scores stay comparable.
task: social_iqa
dataset_path: allenai/social_i_qa
dataset_name: null
dataset_kwargs:
  revision: refs/convert/parquet
output_type: multiple_choice
training_split: train
validation_split: validation
doc_to_text: "Q: {{context}} {{question}}\nA:"
target_delimiter: " "
doc_to_choice: "{{[answerA, answerB, answerC]}}"
doc_to_target: "{{ (label|int) - 1 }}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.0